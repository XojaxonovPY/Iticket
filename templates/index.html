{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTicket.uz — Madaniy va ko'ngilochar tadbirlarga chiptalar</title>
    <meta name="description" content="Konsertlar, spektakllar, festivallar va sport musobaqalariga rasmiy chiptalarni onlayn xarid qiling.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23eb1c24'><path d='M2 9v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2zm18 4a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM4 5h16a1 1 0 0 0 0-2H4a1 1 0 0 0 0 2z'/></svg>">

    <!-- Google Font & Brand CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v={% now 'U' %}">

    <!-- React 18 & ReactDOM (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- In-browser JSX parser (Babel) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS (CDN) & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--color-primary)',
                        'primary-hover': 'var(--color-primary-hover)',
                        'primary-light': 'var(--color-primary-light)',
                        surface: 'var(--bg-surface)',
                        card: 'var(--bg-card)',
                        'card-hover': 'var(--bg-card-hover)',
                        subtle: 'var(--bg-subtle)',
                        input: 'var(--bg-input)',
                        'border-subtle': 'var(--border-subtle)',
                        'border-card': 'var(--border-card)',
                        'border-hover': 'var(--border-hover)',
                        'text-main': 'var(--text-main)',
                        'text-secondary': 'var(--text-secondary)',
                        'text-muted': 'var(--text-muted)',
                        status: {
                            success: 'var(--color-success)',
                            'success-bg': 'var(--color-success-bg)',
                            warning: 'var(--color-warning)',
                            'warning-bg': 'var(--color-warning-bg)',
                            danger: 'var(--color-danger)',
                            'danger-bg': 'var(--color-danger-bg)',
                            info: 'var(--color-info)',
                            'info-bg': 'var(--color-info-bg)',
                        }
                    }
                }
            }
        };
    </script>
    <script>
        // Synchronous theme detection to avoid FOUC
        (function () {
            try {
                const storedTheme = localStorage.getItem('iticket_theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased min-h-screen selection:bg-rose-500 selection:text-white transition-colors duration-200">

    <!-- React Root Mount -->
    <div id="root"></div>

    <!-- Django Configuration for Frontend -->
    <script>
        window.DJANGO_CONFIG = {
            csrfToken: "{{ csrf_token }}",
            baseUrl: "{{ BASE_URL|default:'' }}",
            version: "{% now 'U' %}"
        };
    </script>

    <!-- 1. Central Theme Manager, Localization, API Client & Services Layer (Vanilla JS) -->
    <script src="{% static 'js/theme.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/i18n.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/api/client.js' %}?v={% now 'U' %}"></script>
    <script src="{% static 'js/api/services.js' %}?v={% now 'U' %}"></script>

    <!-- 2. UI Primitives & Components (Babel JSX) -->
    <script type="text/babel" src="{% static 'js/components/ui/UIComponents.js' %}?v={% now 'U' %}"></script>
    <script type="text/babel" src="{% static 'js/components/Toast.js' %}?v={% now 'U' %}"></script>
    <script type="text/babel" src="{% static 'js/components/EventCard.js' %}?v={% now 'U' %}"></script>
    <script type="text/babel" src="{% static 'js/components/Navbar.js' %}?v={% now 'U' %}"></script>
    <script type="text/babel" src="{% static 'js/components/Footer.js' %}?v={% now 'U' %}"></script>
    <script type="text/babel" src="{% static 'js/components/AuthModal.js' %}?v={% now 'U' %}"></script>

    <!-- 3. Pages Layer (Babel JSX) -->
    <script type="text/babel" src="{% static 'js/pages/HomePage.js' %}?v={% now 'U' %}"></script>
    <script type="text/babel" src="{% static 'js/pages/EventDetailPage.js' %}?v={% now 'U' %}"></script>
    <script type="text/babel" src="{% static 'js/pages/CartPage.js' %}?v={% now 'U' %}"></script>
    <script type="text/babel" src="{% static 'js/pages/CheckoutPage.js' %}?v={% now 'U' %}"></script>
    <script type="text/babel" src="{% static 'js/pages/ProfilePage.js' %}?v={% now 'U' %}"></script>
    <script type="text/babel" src="{% static 'js/pages/WishlistPage.js' %}?v={% now 'U' %}"></script>
    <script type="text/babel" src="{% static 'js/pages/OutletsPage.js' %}?v={% now 'U' %}"></script>
    <script type="text/babel" src="{% static 'js/pages/FAQPage.js' %}?v={% now 'U' %}"></script>

    <!-- 4. Main App & Router Entrypoint (Babel JSX) -->
    <script type="text/babel" src="{% static 'js/app.js' %}?v={% now 'U' %}"></script>
</body>
</html>
